[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/stl-viewer"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
stlv-core = { path = "crates/stlv-core" }
stlv-render = { path = "crates/stlv-render" }
stlv-thumbs = { path = "crates/stlv-thumbs" }
stlv-media = { path = "crates/stlv-media" }

# GUI — egui 0.36 pins wgpu 30; keep these in lockstep.
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "wgpu", "accesskit"] }
egui = "0.36.2"
egui-wgpu = "0.36.2"
wgpu = "30.0.1"

bytemuck = { version = "1.25", features = ["derive"] }
glam = "0.34"
pollster = "1.0.1"
crossbeam-channel = "0.5.17"
log = "0.4"
env_logger = "0.11"

# Every dependency must be pure Rust: the target machine has no C compiler.
# (`zip` defaults pull bzip2/zstd/lzma C code, so only the zlib-rs inflater is enabled.)
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "tiff", "gif"] }
resvg = "0.48.1"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
roxmltree = "0.21.1"
md-5 = "0.11.0"
rfd = "0.17.2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com"] }
windows-core = "0.62.2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
strip = "debuginfo"
